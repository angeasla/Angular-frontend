server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Spring backend so the app works when accessed directly on this port
    # (docker-compose maps host:4200 → this container:80; without this block, nginx returns 405
    # for every POST because try_files can't handle non-GET requests).
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
    }

    # SPA: route everything to index.html so Angular's router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the SPA shell. A deploy ships new hashed asset names; a cached index.html would
    # keep pointing browsers at asset URLs that no longer exist (white screen until hard-refresh).
    # Revalidate on every load — it's tiny, and it lets the immutable assets below be cached forever.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache hashed build assets aggressively (content-hashed filenames => safe to keep forever).
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
